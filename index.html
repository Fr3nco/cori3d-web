<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cori3D | Catálogo de Modelos & Impresiones 3D</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .carousel-slide {
      transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

  <!-- Header Responsive -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2">
      
      <div class="flex items-center gap-2 sm:gap-4">
        <a href="#" class="flex items-center gap-2 sm:gap-3 group">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-950 text-white flex items-center justify-center font-bold text-lg shadow-sm">
            <i class="ph-bold ph-cube text-brand-500 text-xl sm:text-2xl"></i>
          </div>
          <div>
            <span class="text-lg sm:text-xl font-black tracking-tight text-slate-900 leading-none">Cori<span class="text-brand-600">3D</span></span>
            <span class="block text-[9px] sm:text-[10px] font-semibold uppercase tracking-wider text-slate-400 mt-0.5">Additive Design</span>
          </div>
        </a>

        <div class="hidden md:flex items-center gap-2 pl-3 border-l border-slate-200 text-xs text-slate-600">
          <span class="flex h-2 w-2 relative">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-500"></span>
          </span>
          <span class="font-medium text-slate-500">Área máx:</span>
          <span class="font-bold text-slate-800 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">180 × 180 × 180 mm</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="#catalogo" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-semibold active:scale-95 transition-all">
          <span>Catálogo</span>
          <i class="ph-bold ph-arrow-down"></i>
        </a>
      </div>

    </div>
  </header>

  <!-- Hero Carousel (Adaptable en móvil para no tapar la pantalla) -->
  <section class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-3 sm:pt-6 pb-6 w-full">
    <div class="relative bg-slate-950 rounded-2xl sm:rounded-3xl overflow-hidden shadow-xl aspect-[16/10] sm:aspect-[21/9] min-h-[260px] sm:min-h-[380px] flex items-center">
      
      <div id="carouselContainer" class="relative w-full h-full">
        <!-- Inyectado por JS -->
      </div>

      <button onclick="prevSlide()" aria-label="Anterior" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 z-20 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-black/40 backdrop-blur-md text-white flex items-center justify-center active:scale-90 transition-all">
        <i class="ph-bold ph-caret-left text-lg"></i>
      </button>
      <button onclick="nextSlide()" aria-label="Siguiente" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 z-20 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-black/40 backdrop-blur-md text-white flex items-center justify-center active:scale-90 transition-all">
        <i class="ph-bold ph-caret-right text-lg"></i>
      </button>

      <div id="carouselDots" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full">
        <!-- Dots JS -->
      </div>
    </div>
  </section>

  <!-- Catálogo Principal -->
  <main id="catalogo" class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pb-16 w-full flex-grow">
    
    <!-- Barra superior de búsqueda y filtros -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-200">
      <div>
        <div class="flex items-center gap-2">
          <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Piezas Disponibles</h2>
          <span id="productCounterBadge" class="bg-brand-100 text-brand-800 text-[11px] font-bold px-2 py-0.5 rounded-full">0</span>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Primero los artículos con entrega y precio inmediato.</p>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <!-- Buscador -->
        <div class="relative flex-grow sm:w-64">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i class="ph-bold ph-magnifying-glass text-base"></i>
          </span>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Buscar piezas..." 
            class="w-full pl-9 pr-8 py-2 rounded-xl bg-white border border-slate-200 text-xs placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900"
            oninput="handleSearch(this.value)"
          >
          <button 
            id="clearSearchBtn" 
            onclick="clearSearch()" 
            class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400">
            <i class="ph-bold ph-x-circle text-base"></i>
          </button>
        </div>

        <!-- Botón Filtros -->
        <button 
          id="toggleFiltersBtn"
          onclick="toggleFilterPanel()" 
          class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white border border-slate-200 hover:border-slate-300 text-slate-800 text-xs font-bold shadow-sm active:scale-95 flex-shrink-0">
          <i class="ph-bold ph-sliders-horizontal text-brand-600 text-sm"></i>
          <span>Filtros</span>
          <span id="activeFiltersBadge" class="hidden w-4 h-4 rounded-full bg-brand-600 text-white text-[9px] items-center justify-center font-bold">0</span>
          <i id="filtersCaretIcon" class="ph-bold ph-caret-down text-[10px] transition-transform duration-200"></i>
        </button>
      </div>
    </div>

    <!-- Panel de Filtros -->
    <div id="filterPanel" class="hidden mt-3 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-xs font-black text-slate-900 uppercase tracking-wider">Ajustar Filtros</h3>
        <button onclick="resetFilters()" class="text-[11px] font-bold text-red-600 hover:underline">Limpiar todo</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
        <div class="sm:col-span-5 space-y-2.5">
          <span class="text-[11px] font-bold text-slate-700 uppercase block">Rango de Precio ($)</span>
          <div class="flex items-center gap-2">
            <input 
              type="number" 
              id="minPriceInput" 
              placeholder="Mín" 
              oninput="handleCustomPriceRange()"
              class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-slate-50 border border-slate-200 font-mono"
            >
            <span class="text-slate-400 font-bold">-</span>
            <input 
              type="number" 
              id="maxPriceInput" 
              placeholder="Máx" 
              oninput="handleCustomPriceRange()"
              class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-slate-50 border border-slate-200 font-mono"
            >
          </div>
          <select 
            id="priceOrderSelect" 
            onchange="handlePriceOrderChange(this.value)" 
            class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700">
            <option value="all">Ordenar: Relevancia</option>
            <option value="low-to-high">Precio: Menor a Mayor</option>
            <option value="high-to-low">Precio: Mayor a Menor</option>
          </select>
        </div>

        <div class="sm:col-span-7 sm:border-l sm:border-slate-100 sm:pl-4">
          <span class="text-[11px] font-bold text-slate-700 uppercase block mb-1.5">Filtrar por Etiquetas</span>
          <div id="filterTagsGrid" class="flex flex-wrap gap-1 max-h-44 overflow-y-auto p-1.5 bg-slate-50 rounded-xl border border-slate-100">
            <!-- Chips JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- Resumen de Filtros Activos -->
    <div id="activeFiltersSummary" class="hidden py-2 flex items-center gap-1.5 flex-wrap text-xs">
      <div id="activeChipsContainer" class="flex items-center gap-1.5 flex-wrap"></div>
      <button onclick="resetFilters()" class="text-[11px] font-bold text-slate-500 hover:text-slate-800 underline ml-1">Restablecer</button>
    </div>

    <!-- Grilla de Productos (2 columnas compactas en móvil, 3 en tablet, 4 en PC) -->
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5 pt-3">
      <!-- Cards JS -->
    </div>

    <div id="noResultsNotice" class="hidden py-12 text-center">
      <i class="ph-duotone ph-cube text-3xl text-slate-400 block mb-2"></i>
      <h3 class="text-sm font-bold text-slate-800">No encontramos modelos con esos criterios</h3>
      <button onclick="resetFilters()" class="mt-3 px-3 py-1.5 text-xs font-bold bg-slate-900 text-white rounded-lg">Ver catálogo completo</button>
    </div>
  </main>

  <!-- Modal Detalle -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 opacity-0 pointer-events-none transition-all duration-200">
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" onclick="closeDetailModal()"></div>

    <div class="relative w-full max-w-3xl bg-white rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden z-10 flex flex-col max-h-[90vh]" id="detailModalBox">
      <button 
        type="button" 
        onclick="closeDetailModal()" 
        class="absolute top-3 right-3 z-30 w-8 h-8 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center shadow">
        <i class="ph-bold ph-x text-base pointer-events-none"></i>
      </button>

      <div class="overflow-y-auto p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <div class="relative aspect-square bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
            <img id="modalMainImage" src="" class="w-full h-full object-cover">
            <span id="modalMaterialBadge" class="absolute bottom-2 left-2 px-2 py-0.5 rounded text-[10px] font-black bg-brand-500 text-white">PLA</span>
          </div>
          <div id="modalThumbnails" class="grid grid-cols-4 gap-1.5 mt-2"></div>
        </div>

        <div class="flex flex-col justify-between">
          <div>
            <span id="modalSku" class="text-[11px] font-mono text-slate-400">SKU</span>
            <h3 id="modalTitle" class="text-lg sm:text-xl font-black text-slate-900 mt-1">Nombre</h3>
            <div id="modalPrice" class="text-xl font-extrabold text-slate-900 mt-1.5 font-mono">$0</div>
            <p id="modalDescription" class="mt-2 text-xs text-slate-600 leading-relaxed whitespace-pre-line"></p>
            
            <div class="mt-3 flex flex-wrap gap-1" id="modalTagsContainer"></div>
            
            <div class="mt-4 pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs" id="modalSpecs"></div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex gap-2">
            <button onclick="handleInquireAction()" class="flex-grow py-2.5 px-3 rounded-xl bg-slate-900 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow">
              <i class="ph-bold ph-whatsapp-logo text-brand-400 text-base"></i>
              <span>Consultar WhatsApp</span>
            </button>
            <button onclick="copyProductLink()" class="p-2.5 rounded-xl bg-slate-100 text-slate-700">
              <i class="ph-bold ph-share-network text-base"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-16 opacity-0 transition-all pointer-events-none bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold">
    <span id="toastMessage">Enlace copiado</span>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCd-JtST4lQElUnldKjTVYJ7ytOmiH4Bok",
      authDomain: "cori3d-d5904.firebaseapp.com",
      projectId: "cori3d-d5904",
      storageBucket: "cori3d-d5904.firebasestorage.app",
      messagingSenderId: "250125080972",
      appId: "1:250125080972:web:8b7eb2ced9d87cc3039ea9",
      measurementId: "G-PCVLY0WW55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const productsCol = collection(db, "products");

    const ALL_TAGS = [
      "Antiestrés", "Maquillaje", "ASMR", "Personal", "Juegos de Mesa", "Artístico",
      "Decoración", "Accesorios", "Organización", "Utilidades", "Repuestos",
      "Personalizado", "Modular", "Colección", "Hogar", "Oficina",
      "Tecnología", "Gaming", "Infantil", "Mascotas", "Automotor",
      "Interior", "Exterior", "Cocina", "Baño", "Jardín",
      "Dormitorio", "Living", "Taller", "Viajes", "Almacenamiento",
      "Iluminación", "Herramientas", "Juguetes", "Kit"
    ];

    let products = [];
    let currentSlideIndex = 0;
    let autoSlideInterval = null;
    let selectedFilterTags = [];
    let activeSearchQuery = "";
    let activePriceOrder = "all";
    let activeMinPrice = null;
    let activeMaxPrice = null;
    let activeProductInModal = null;
    let activeModalImageIndex = 0;

    // Parser seguro: si no tiene precio o dice "Consultar", devuelve 0
    function parseNumericPrice(priceStr) {
      if (!priceStr) return 0;
      const str = String(priceStr).toLowerCase().trim();
      if (str.includes("consultar") || str.includes("pedido") || str === "$0" || str === "$0.00") return 0;
      
      let clean = str.replace(/[^0-9,\.]/g, '').trim();
      if (clean.includes('.')) {
        if (clean.includes(',')) {
          clean = clean.replace(/\./g, '').replace(',', '.');
        } else {
          clean = clean.replace(/\./g, '');
        }
      } else if (clean.includes(',')) {
        clean = clean.replace(',', '.');
      }
      return parseFloat(clean) || 0;
    }

    function isAvailableForDirectPurchase(priceStr) {
      return parseNumericPrice(priceStr) > 0;
    }

    function getFormattedDimensions(dims) {
      if (!dims) return "Sin esp.";
      const l = String(dims.length || "").trim();
      const w = String(dims.width || "").trim();
      const h = String(dims.height || "").trim();
      if (!l || !w || !h || l === "-" || l.toLowerCase() === "sin especificar") return "Sin esp.";
      return `${l}×${w}×${h} mm`;
    }

    function getProductTags(prod) {
      if (Array.isArray(prod.tags) && prod.tags.length > 0) return prod.tags;
      if (prod.category) return [prod.category];
      return ["General"];
    }

    function initRealtimeListener() {
      onSnapshot(productsCol, (snapshot) => {
        products = snapshot.docs.map(doc => doc.data());
        refreshAllViews();
      }, (err) => console.error(err));
    }

    function initCarousel() {
      const container = document.getElementById('carouselContainer');
      const dotsContainer = document.getElementById('carouselDots');
      if (!container || !dotsContainer) return;

      container.innerHTML = '';
      dotsContainer.innerHTML = '';

      const featured = products.filter(p => p.featured && isAvailableForDirectPurchase(p.price));
      const displaySlides = featured.length > 0 ? featured : products.filter(p => isAvailableForDirectPurchase(p.price)).slice(0, 3);

      if (displaySlides.length === 0) {
        container.innerHTML = '<div class="flex items-center justify-center h-full text-slate-400 text-xs">Modelos listos para producción</div>';
        return;
      }

      displaySlides.forEach((prod, idx) => {
        const slide = document.createElement('div');
        slide.className = `carousel-slide absolute inset-0 w-full h-full flex flex-col justify-end p-4 sm:p-8 ${
          idx === 0 ? 'opacity-100 scale-100 z-10' : 'opacity-0 scale-95 z-0 pointer-events-none'
        }`;
        
        slide.innerHTML = `
          <div class="absolute inset-0 z-0">
            <img src="${(prod.images && prod.images[0]) || 'https://placehold.co/800x600?text=3D'}" class="w-full h-full object-cover filter brightness-[0.55]">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent"></div>
          </div>
          <div class="relative z-10 text-white max-w-xl">
            <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-brand-500 text-slate-950">${prod.material || 'PLA'}</span>
            <h1 class="text-lg sm:text-2xl font-black mt-1 leading-tight line-clamp-1">${prod.title}</h1>
            <div class="mt-2 flex items-center gap-3">
              <span class="text-base sm:text-xl font-extrabold font-mono text-brand-400">${prod.price}</span>
              <button onclick="openDetailModalById(${prod.id})" class="px-3 py-1 rounded-lg bg-white text-slate-950 text-xs font-bold">Ver pieza</button>
            </div>
          </div>
        `;
        container.appendChild(slide);

        const dot = document.createElement('button');
        dot.className = `h-1.5 rounded-full transition-all ${idx === 0 ? 'w-5 bg-brand-400' : 'w-1.5 bg-white/40'}`;
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });

      startAutoSlide(displaySlides.length);
    }

    function updateSlideDisplay() {
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('#carouselDots button');
      slides.forEach((slide, idx) => {
        const dot = dots[idx];
        if (idx === currentSlideIndex) {
          slide.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'z-0');
          slide.classList.add('opacity-100', 'scale-100', 'z-10');
          if (dot) { dot.classList.remove('w-1.5', 'bg-white/40'); dot.classList.add('w-5', 'bg-brand-400'); }
        } else {
          slide.classList.remove('opacity-100', 'scale-100', 'z-10');
          slide.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'z-0');
          if (dot) { dot.classList.remove('w-5', 'bg-brand-400'); dot.classList.add('w-1.5', 'bg-white/40'); }
        }
      });
    }

    function nextSlide() {
      const count = document.querySelectorAll('.carousel-slide').length;
      if (count <= 1) return;
      currentSlideIndex = (currentSlideIndex + 1) % count;
      updateSlideDisplay();
    }

    function prevSlide() {
      const count = document.querySelectorAll('.carousel-slide').length;
      if (count <= 1) return;
      currentSlideIndex = (currentSlideIndex - 1 + count) % count;
      updateSlideDisplay();
    }

    function goToSlide(idx) {
      currentSlideIndex = idx;
      updateSlideDisplay();
    }

    function startAutoSlide(count) {
      if (count <= 1) return;
      clearInterval(autoSlideInterval);
      autoSlideInterval = setInterval(nextSlide, 5000);
    }

    function toggleFilterPanel() {
      const panel = document.getElementById('filterPanel');
      const caret = document.getElementById('filtersCaretIcon');
      if (!panel) return;
      panel.classList.toggle('hidden');
      if (caret) caret.classList.toggle('rotate-180');
    }

    function renderFilterTagsGrid() {
      const container = document.getElementById('filterTagsGrid');
      if (!container) return;
      container.innerHTML = '';

      ALL_TAGS.forEach(tag => {
        const isSelected = selectedFilterTags.includes(tag);
        const btn = document.createElement('button');
        btn.type = "button";
        btn.className = `px-2 py-1 rounded-lg text-[11px] font-bold transition-all ${
          isSelected ? 'bg-slate-900 text-white shadow-xs' : 'bg-white text-slate-600 border border-slate-200'
        }`;
        btn.textContent = tag;
        btn.onclick = () => toggleFilterTag(tag);
        container.appendChild(btn);
      });

      updateActiveFiltersBadge();
      renderActiveChipsBar();
    }

    function toggleFilterTag(tag) {
      if (selectedFilterTags.includes(tag)) {
        selectedFilterTags = selectedFilterTags.filter(t => t !== tag);
      } else {
        selectedFilterTags.push(tag);
      }
      renderFilterTagsGrid();
      renderProductGrid();
    }

    function renderActiveChipsBar() {
      const summaryBar = document.getElementById('activeFiltersSummary');
      const container = document.getElementById('activeChipsContainer');
      if (!summaryBar || !container) return;

      container.innerHTML = '';
      let hasFilters = false;

      selectedFilterTags.forEach(tag => {
        hasFilters = true;
        const chip = document.createElement('span');
        chip.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-900 text-white font-bold text-[10px]";
        chip.innerHTML = `${tag} <button onclick="toggleFilterTag('${tag}')">×</button>`;
        container.appendChild(chip);
      });

      if ((activeMinPrice !== null && !isNaN(activeMinPrice)) || (activeMaxPrice !== null && !isNaN(activeMaxPrice))) {
        hasFilters = true;
        const chip = document.createElement('span');
        chip.className = "inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-brand-100 text-brand-900 font-bold text-[10px]";
        chip.innerHTML = `Precio fijado <button onclick="clearPriceRange()">×</button>`;
        container.appendChild(chip);
      }

      summaryBar.classList.toggle('hidden', !hasFilters);
    }

    function updateActiveFiltersBadge() {
      const badge = document.getElementById('activeFiltersBadge');
      if (!badge) return;
      const count = selectedFilterTags.length + (activeMinPrice !== null || activeMaxPrice !== null ? 1 : 0);
      badge.textContent = count;
      badge.classList.toggle('hidden', count === 0);
      badge.classList.toggle('flex', count > 0);
    }

    function renderProductGrid() {
      const grid = document.getElementById('productGrid');
      const emptyNotice = document.getElementById('noResultsNotice');
      const counterBadge = document.getElementById('productCounterBadge');
      if (!grid) return;

      let filtered = products.filter(prod => {
        const prodTags = getProductTags(prod);
        let matchesTags = selectedFilterTags.length === 0 || selectedFilterTags.some(t => prodTags.includes(t));

        const q = activeSearchQuery.toLowerCase().trim();
        let matchesQuery = !q || (prod.title && prod.title.toLowerCase().includes(q)) || prodTags.some(t => t.toLowerCase().includes(q));

        const numPrice = parseNumericPrice(prod.price);
        let matchesMin = activeMinPrice === null || isNaN(activeMinPrice) || numPrice >= activeMinPrice;
        let matchesMax = activeMaxPrice === null || isNaN(activeMaxPrice) || numPrice <= activeMaxPrice;

        return matchesTags && matchesQuery && matchesMin && matchesMax;
      });

      // ORDENAMIENTO ESTRICTO:
      // 1. Productos con precio comprable primero
      // 2. Productos "Consultar", precio 0 o vacíos SIEMPRE AL FINAL
      filtered.sort((a, b) => {
        const canBuyA = isAvailableForDirectPurchase(a.price);
        const canBuyB = isAvailableForDirectPurchase(b.price);

        if (canBuyA && !canBuyB) return -1;
        if (!canBuyA && canBuyB) return 1;

        if (activePriceOrder === 'low-to-high') return parseNumericPrice(a.price) - parseNumericPrice(b.price);
        if (activePriceOrder === 'high-to-low') return parseNumericPrice(b.price) - parseNumericPrice(a.price);

        return (b.id || 0) - (a.id || 0);
      });

      if (counterBadge) counterBadge.textContent = filtered.length;
      grid.innerHTML = '';

      if (filtered.length === 0) {
        if (emptyNotice) emptyNotice.classList.remove('hidden');
        return;
      }
      if (emptyNotice) emptyNotice.classList.add('hidden');

      filtered.forEach(prod => {
        const card = document.createElement('article');
        card.className = "group bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-xs flex flex-col cursor-pointer";
        card.onclick = () => openDetailModalById(prod.id);

        const photo = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://placehold.co/400x400?text=3D';
        const canBuy = isAvailableForDirectPurchase(prod.price);
        const displayPrice = canBuy ? prod.price : 'Consultar';

        card.innerHTML = `
          <div class="relative w-full aspect-square bg-slate-100 overflow-hidden">
            <img src="${photo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
            <div class="absolute top-2 left-2 flex flex-col gap-1">
              <span class="px-1.5 py-0.5 rounded text-[9px] font-black uppercase ${canBuy ? 'bg-brand-500 text-white' : 'bg-slate-700 text-white'}">
                ${prod.material || 'PLA'}
              </span>
            </div>
            ${!canBuy ? '<div class="absolute inset-x-0 bottom-0 py-1 bg-slate-900/80 text-center text-[10px] text-white font-bold backdrop-blur-xs">A pedido / Personalizado</div>' : ''}
          </div>

          <div class="p-2.5 sm:p-3 flex flex-col flex-grow justify-between">
            <div>
              <span class="text-[9px] font-mono text-slate-400 block">${prod.sku || '3D'}</span>
              <h3 class="font-bold text-slate-900 text-xs sm:text-sm line-clamp-1 mt-0.5 group-hover:text-brand-600 transition-colors">${prod.title}</h3>
            </div>

            <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between">
              <div>
                <span class="text-[12px] sm:text-sm font-black font-mono ${canBuy ? 'text-slate-900' : 'text-slate-500'}">${displayPrice}</span>
              </div>
              <div class="w-6 h-6 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center group-hover:bg-slate-900 group-hover:text-white transition-colors">
                <i class="ph-bold ph-arrow-right text-xs"></i>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleSearch(val) {
      activeSearchQuery = val;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) clearBtn.classList.toggle('hidden', val.trim().length === 0);
      renderProductGrid();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) { input.value = ''; handleSearch(''); }
    }

    function handlePriceOrderChange(val) {
      activePriceOrder = val;
      renderProductGrid();
    }

    function handleCustomPriceRange() {
      const minVal = document.getElementById('minPriceInput').value.trim();
      const maxVal = document.getElementById('maxPriceInput').value.trim();
      activeMinPrice = minVal !== "" ? parseFloat(minVal) : null;
      activeMaxPrice = maxVal !== "" ? parseFloat(maxVal) : null;
      updateActiveFiltersBadge();
      renderActiveChipsBar();
      renderProductGrid();
    }

    function clearPriceRange() {
      activeMinPrice = null;
      activeMaxPrice = null;
      document.getElementById('minPriceInput').value = '';
      document.getElementById('maxPriceInput').value = '';
      renderActiveChipsBar();
      updateActiveFiltersBadge();
      renderProductGrid();
    }

    function resetFilters() {
      selectedFilterTags = [];
      activePriceOrder = "all";
      activeMinPrice = null;
      activeMaxPrice = null;
      const orderSelect = document.getElementById('priceOrderSelect');
      if (orderSelect) orderSelect.value = "all";
      clearPriceRange();
      clearSearch();
      renderFilterTagsGrid();
      renderProductGrid();
    }

    function openDetailModalById(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      activeProductInModal = product;
      activeModalImageIndex = 0;

      const canBuy = isAvailableForDirectPurchase(product.price);

      document.getElementById('modalSku').textContent = product.sku || '3D';
      document.getElementById('modalTitle').textContent = product.title;
      document.getElementById('modalPrice').textContent = canBuy ? product.price : 'Cotización / Consultar';
      document.getElementById('modalDescription').textContent = product.description || 'Sin descripción adicional.';
      document.getElementById('modalMaterialBadge').textContent = product.material || 'PLA';

      const tagsContainer = document.getElementById('modalTagsContainer');
      tagsContainer.innerHTML = '';
      getProductTags(product).forEach(t => {
        const badge = document.createElement('span');
        badge.className = "px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-bold";
        badge.textContent = t;
        tagsContainer.appendChild(badge);
      });

      const specsContainer = document.getElementById('modalSpecs');
      specsContainer.innerHTML = `
        <div class="p-2 bg-slate-50 rounded-lg">
          <span class="text-[9px] uppercase font-bold text-slate-400 block">Medidas</span>
          <span class="text-xs font-bold text-slate-700">${getFormattedDimensions(product.dimensions)}</span>
        </div>
        <div class="p-2 bg-slate-50 rounded-lg">
          <span class="text-[9px] uppercase font-bold text-slate-400 block">Material</span>
          <span class="text-xs font-bold text-slate-700">${product.material || 'PLA'}</span>
        </div>
      `;

      updateModalGallery();
      document.getElementById('detailModal').classList.remove('opacity-0', 'pointer-events-none');
    }

    function updateModalGallery() {
      if (!activeProductInModal) return;
      const images = (activeProductInModal.images && activeProductInModal.images.length > 0)
        ? activeProductInModal.images
        : ['https://placehold.co/400x400?text=3D'];

      document.getElementById('modalMainImage').src = images[activeModalImageIndex] || images[0];
      const thumbsContainer = document.getElementById('modalThumbnails');
      thumbsContainer.innerHTML = '';

      images.forEach((imgUrl, index) => {
        const btn = document.createElement('button');
        btn.className = `aspect-square rounded-lg overflow-hidden border ${index === activeModalImageIndex ? 'border-slate-900' : 'border-transparent opacity-60'}`;
        btn.onclick = () => { activeModalImageIndex = index; updateModalGallery(); };
        btn.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover">`;
        thumbsContainer.appendChild(btn);
      });
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('opacity-0', 'pointer-events-none');
      activeProductInModal = null;
    }

    function refreshAllViews() {
      initCarousel();
      renderFilterTagsGrid();
      renderProductGrid();
    }

    function handleInquireAction() {
      if (!activeProductInModal) return;
      const dims = getFormattedDimensions(activeProductInModal.dimensions);
      const text = encodeURIComponent(`Hola! Quiero consultar por: "${activeProductInModal.title}" (${activeProductInModal.material}, ${dims})`);
      window.open(`https://wa.me/5491123539321?text=${text}`, '_blank');
    }

    function copyProductLink() {
      if (!activeProductInModal) return;
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = `${window.location.origin}${window.location.pathname}#product-${activeProductInModal.id}`;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      const toast = document.getElementById('toast');
      toast.classList.remove('translate-y-16', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-16', 'opacity-0'), 2500);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
    window.toggleFilterPanel = toggleFilterPanel;
    window.toggleFilterTag = toggleFilterTag;
    window.clearPriceRange = clearPriceRange;
    window.handleSearch = handleSearch;
    window.clearSearch = clearSearch;
    window.handlePriceOrderChange = handlePriceOrderChange;
    window.handleCustomPriceRange = handleCustomPriceRange;
    window.resetFilters = resetFilters;
    window.openDetailModalById = openDetailModalById;
    window.closeDetailModal = closeDetailModal;
    window.handleInquireAction = handleInquireAction;
    window.copyProductLink = copyProductLink;

    initRealtimeListener();
  </script>
</body>
</html>
