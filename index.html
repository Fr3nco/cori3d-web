<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cori3D | Catálogo de Modelos & Impresiones 3D</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .carousel-slide { transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans selection:bg-brand-500 selection:text-white">

  <!-- Header Principal -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-4">
        <a href="#" class="flex items-center gap-2 sm:gap-3 group">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-950 text-white flex items-center justify-center font-bold text-lg shadow-sm">
            <i class="ph-bold ph-cube text-brand-500 text-xl sm:text-2xl"></i>
          </div>
          <div>
            <span class="text-lg sm:text-xl font-black tracking-tight text-slate-900 leading-none">Cori<span class="text-brand-600">3D</span></span>
            <span class="block text-[9px] sm:text-[10px] font-semibold uppercase tracking-wider text-slate-400 mt-0.5">Additive Design</span>
          </div>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <a href="#catalogo" class="flex items-center gap-1.5 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-semibold active:scale-95 transition-all">
          <span>Catálogo</span>
          <i class="ph-bold ph-arrow-down"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Carrusel -->
  <section class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pt-3 sm:pt-6 pb-6 w-full">
    <div class="relative bg-slate-950 rounded-2xl sm:rounded-3xl overflow-hidden shadow-xl aspect-[16/10] sm:aspect-[21/9] min-h-[260px] sm:min-h-[360px] flex items-center">
      <div id="carouselContainer" class="relative w-full h-full"></div>
      <button onclick="prevSlide()" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 z-20 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-black/40 backdrop-blur-md text-white flex items-center justify-center active:scale-90 transition-all">
        <i class="ph-bold ph-caret-left text-lg"></i>
      </button>
      <button onclick="nextSlide()" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 z-20 w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-black/40 backdrop-blur-md text-white flex items-center justify-center active:scale-90 transition-all">
        <i class="ph-bold ph-caret-right text-lg"></i>
      </button>
      <div id="carouselDots" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-1.5 bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full"></div>
    </div>
  </section>

  <!-- Catálogo -->
  <main id="catalogo" class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 pb-16 w-full flex-grow">
    
    <!-- BARRA FLOTANTE / STICKY: Búsqueda y Botón de Filtros -->
    <div class="sticky top-16 sm:top-20 z-30 bg-slate-50/95 backdrop-blur-md pt-2 pb-3 border-b border-slate-200/80 transition-all">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight">Piezas Disponibles</h2>
            <span id="productCounterBadge" class="bg-brand-100 text-brand-800 text-[11px] font-bold px-2 py-0.5 rounded-full">0</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block"></p>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <!-- Buscador -->
          <div class="relative flex-grow sm:w-64">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="ph-bold ph-magnifying-glass text-base"></i>
            </span>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Buscar piezas..." 
              class="w-full pl-9 pr-8 py-2 rounded-xl bg-white border border-slate-200 text-xs placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 shadow-xs"
              oninput="handleSearch(this.value)"
            >
            <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 cursor-pointer">
              <i class="ph-bold ph-x-circle text-base"></i>
            </button>
          </div>

          <!-- Botón Filtros -->
          <button onclick="toggleFilterPanel()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-800 text-xs font-bold shadow-xs active:scale-95 flex-shrink-0 cursor-pointer">
            <i class="ph-bold ph-sliders-horizontal text-brand-600 text-sm"></i>
            <span>Filtros</span>
            <span id="activeFiltersBadge" class="hidden w-4 h-4 rounded-full bg-brand-600 text-white text-[9px] items-center justify-center font-bold">0</span>
          </button>
        </div>
      </div>

      <!-- Resumen rápido de filtros aplicados dentro de la barra sticky -->
      <div id="activeFiltersSummary" class="hidden pt-2 flex items-center gap-1.5 flex-wrap text-xs">
        <div id="activeChipsContainer" class="flex items-center gap-1.5 flex-wrap"></div>
        <button onclick="resetFilters()" class="text-[11px] font-bold text-slate-500 hover:text-slate-800 underline ml-1 cursor-pointer">Restablecer</button>
      </div>
    </div>

    <!-- Panel Desplegable de Filtros -->
    <div id="filterPanel" class="hidden mt-3 p-4 bg-white rounded-2xl border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <h3 class="text-xs font-black text-slate-900 uppercase">Filtros Avanzados</h3>
        <button onclick="resetFilters()" class="text-[11px] font-bold text-red-600 hover:underline cursor-pointer">Limpiar todo</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-12 gap-4">
        <div class="sm:col-span-5 space-y-2">
          <span class="text-[11px] font-bold text-slate-700 uppercase block">Rango de Precio ($)</span>
          <div class="flex items-center gap-2">
            <input type="number" id="minPriceInput" placeholder="Mín" oninput="handleCustomPriceRange()" class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-slate-50 border border-slate-200 font-mono">
            <span class="text-slate-400">-</span>
            <input type="number" id="maxPriceInput" placeholder="Máx" oninput="handleCustomPriceRange()" class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-slate-50 border border-slate-200 font-mono">
          </div>
          <select id="priceOrderSelect" onchange="handlePriceOrderChange(this.value)" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 border border-slate-200 text-xs font-semibold text-slate-700">
            <option value="all">Ordenar: Relevancia</option>
            <option value="low-to-high">Precio: Menor a Mayor</option>
            <option value="high-to-low">Precio: Mayor a Menor</option>
          </select>
        </div>

        <div class="sm:col-span-7 sm:border-l sm:border-slate-100 sm:pl-4">
          <span class="text-[11px] font-bold text-slate-700 uppercase block mb-1.5">Etiquetas</span>
          <div id="filterTagsGrid" class="flex flex-wrap gap-1 max-h-44 overflow-y-auto p-1.5 bg-slate-50 rounded-xl border border-slate-100"></div>
        </div>
      </div>
    </div>

    <!-- Grilla de productos -->
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5 pt-4"></div>

    <div id="noResultsNotice" class="hidden py-12 text-center">
      <i class="ph-duotone ph-cube text-3xl text-slate-400 block mb-2"></i>
      <h3 class="text-sm font-bold text-slate-800">No encontramos coincidencias</h3>
      <button onclick="resetFilters()" class="mt-3 px-3 py-1.5 text-xs font-bold bg-slate-900 text-white rounded-lg cursor-pointer">Ver catálogo completo</button>
    </div>
  </main>

  <!-- Modal Detalle -->
  <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 opacity-0 pointer-events-none transition-all duration-200">
    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm" onclick="closeDetailModal()"></div>

    <div class="relative w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden z-10 flex flex-col max-h-[92vh]">
      <button type="button" onclick="closeDetailModal()" class="absolute top-3 right-3 z-30 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center shadow-xs cursor-pointer">
        <i class="ph-bold ph-x text-base pointer-events-none"></i>
      </button>

      <div class="overflow-y-auto p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <div class="relative aspect-square bg-slate-100 rounded-2xl overflow-hidden border border-slate-200">
            <img id="modalMainImage" src="" class="w-full h-full object-cover">
            <span id="modalMaterialBadge" class="absolute bottom-2 left-2 px-2 py-0.5 rounded text-[10px] font-black bg-brand-500 text-white">PLA</span>
          </div>
          <div id="modalThumbnails" class="grid grid-cols-4 gap-1.5 mt-2"></div>
        </div>

        <div class="flex flex-col justify-between">
          <div>
            <span id="modalSku" class="text-[11px] font-mono text-slate-400">SKU</span>
            <h3 id="modalTitle" class="text-lg sm:text-xl font-black text-slate-900 mt-1">Nombre</h3>
            
            <div class="mt-1.5 flex items-baseline gap-2">
              <span id="modalPrice" class="text-2xl font-black font-mono text-slate-900">$0</span>
              <span id="modalSelectedVariantLabel" class="text-xs font-semibold text-brand-600 hidden"></span>
            </div>

            <!-- Selector de Variantes -->
            <div id="modalVariantsWrapper" class="mt-3 hidden">
              <label class="block text-[11px] font-extrabold uppercase tracking-wide text-slate-500 mb-1.5">
                Seleccioná una opción:
              </label>
              <div id="modalVariantsList" class="space-y-1.5 max-h-40 overflow-y-auto pr-1"></div>
            </div>

            <p id="modalDescription" class="mt-2.5 text-xs text-slate-600 leading-relaxed whitespace-pre-line"></p>
            <div class="mt-3 flex flex-wrap gap-1" id="modalTagsContainer"></div>
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex gap-2">
            <button onclick="handleInquireAction()" class="flex-grow py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-md active:scale-95 transition-all cursor-pointer">
              <i class="ph-bold ph-whatsapp-logo text-brand-400 text-base"></i>
              <span>Consultar / Pedir</span>
            </button>
            <button onclick="copyProductLink()" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 cursor-pointer">
              <i class="ph-bold ph-share-network text-base"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-4 right-4 z-50 transform translate-y-16 opacity-0 transition-all pointer-events-none bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold">
    <span id="toastMessage">Enlace copiado</span>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCd-JtST4lQElUnldKjTVYJ7ytOmiH4Bok",
      authDomain: "cori3d-d5904.firebaseapp.com",
      projectId: "cori3d-d5904",
      storageBucket: "cori3d-d5904.firebasestorage.app",
      messagingSenderId: "250125080972",
      appId: "1:250125080972:web:8b7eb2ced9d87cc3039ea9",
      measurementId: "G-PCVLY0WW55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const productsCol = collection(db, "products");

    const ALL_TAGS = [
      "Antiestrés", "Maquillaje", "ASMR", "Personal", "Juegos de Mesa", "Artístico",
      "Decoración", "Accesorios", "Organización", "Utilidades", "Repuestos",
      "Personalizado", "Modular", "Colección", "Hogar", "Oficina",
      "Tecnología", "Gaming", "Infantil", "Mascotas", "Automotor",
      "Interior", "Exterior", "Cocina", "Baño", "Jardín",
      "Dormitorio", "Living", "Taller", "Viajes", "Almacenamiento",
      "Iluminación", "Herramientas", "Juguetes", "Kit"
    ];

    let products = [];
    let currentSlideIndex = 0;
    let selectedFilterTags = [];
    let activeSearchQuery = "";
    let activePriceOrder = "all";
    let activeMinPrice = null;
    let activeMaxPrice = null;
    let activeProductInModal = null;
    let activeModalImageIndex = 0;
    let currentSelectedVariant = null;

    function parseNumericPrice(priceStr) {
      if (!priceStr) return 0;
      const str = String(priceStr).toLowerCase().trim();
      if (str.includes("consultar") || str.includes("pedido") || str === "$0" || str === "$0.00") return 0;
      let clean = str.replace(/[^0-9,\.]/g, '').trim();
      if (clean.includes('.')) {
        clean = clean.includes(',') ? clean.replace(/\./g, '').replace(',', '.') : clean.replace(/\./g, '');
      } else if (clean.includes(',')) {
        clean = clean.replace(',', '.');
      }
      return parseFloat(clean) || 0;
    }

    function getProductStartingPrice(prod) {
      if (Array.isArray(prod.variants) && prod.variants.length > 0) {
        const numericValues = prod.variants.map(v => parseNumericPrice(v.price)).filter(p => p > 0);
        if (numericValues.length > 0) return Math.min(...numericValues);
      }
      return parseNumericPrice(prod.price);
    }

    function isAvailableForDirectPurchase(prod) {
      return getProductStartingPrice(prod) > 0;
    }

    function getProductTags(prod) {
      if (Array.isArray(prod.tags) && prod.tags.length > 0) return prod.tags;
      if (prod.category) return [prod.category];
      return ["General"];
    }

    function initRealtimeListener() {
      onSnapshot(productsCol, (snapshot) => {
        products = snapshot.docs.map(doc => doc.data());
        refreshAllViews();
      });
    }

    function initCarousel() {
      const container = document.getElementById('carouselContainer');
      const dotsContainer = document.getElementById('carouselDots');
      if (!container || !dotsContainer) return;

      container.innerHTML = '';
      dotsContainer.innerHTML = '';

      const featured = products.filter(p => p.featured && isAvailableForDirectPurchase(p));
      const displaySlides = featured.length > 0 ? featured : products.filter(p => isAvailableForDirectPurchase(p)).slice(0, 3);

      if (displaySlides.length === 0) {
        container.innerHTML = '<div class="flex items-center justify-center h-full text-slate-400 text-xs">Catálogo de Impresiones 3D</div>';
        return;
      }

      displaySlides.forEach((prod, idx) => {
        const slide = document.createElement('div');
        slide.className = `carousel-slide absolute inset-0 w-full h-full flex flex-col justify-end p-4 sm:p-8 ${
          idx === 0 ? 'opacity-100 scale-100 z-10' : 'opacity-0 scale-95 z-0 pointer-events-none'
        }`;
        
        const hasVariants = Array.isArray(prod.variants) && prod.variants.length > 0;
        const displayPrice = hasVariants ? `Desde $${getProductStartingPrice(prod)}` : prod.price;

        slide.innerHTML = `
          <div class="absolute inset-0 z-0">
            <img src="${(prod.images && prod.images[0]) || 'https://placehold.co/800x600?text=3D'}" class="w-full h-full object-cover filter brightness-[0.55]">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent"></div>
          </div>
          <div class="relative z-10 text-white max-w-xl">
            <span class="px-2 py-0.5 rounded text-[9px] font-black uppercase bg-brand-500 text-slate-950">${prod.material || 'PLA'}</span>
            <h1 class="text-lg sm:text-2xl font-black mt-1 leading-tight line-clamp-1">${prod.title}</h1>
            <div class="mt-2 flex items-center gap-3">
              <span class="text-base sm:text-xl font-extrabold font-mono text-brand-400">${displayPrice}</span>
              <button onclick="openDetailModalById(${prod.id})" class="px-3 py-1 rounded-lg bg-white text-slate-950 text-xs font-bold cursor-pointer">Ver opciones</button>
            </div>
          </div>
        `;
        container.appendChild(slide);

        const dot = document.createElement('button');
        dot.className = `h-1.5 rounded-full transition-all ${idx === 0 ? 'w-5 bg-brand-400' : 'w-1.5 bg-white/40'}`;
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });
    }

    function updateSlideDisplay() {
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('#carouselDots button');
      slides.forEach((slide, idx) => {
        const dot = dots[idx];
        if (idx === currentSlideIndex) {
          slide.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'z-0');
          slide.classList.add('opacity-100', 'scale-100', 'z-10');
          if (dot) { dot.classList.remove('w-1.5', 'bg-white/40'); dot.classList.add('w-5', 'bg-brand-400'); }
        } else {
          slide.classList.remove('opacity-100', 'scale-100', 'z-10');
          slide.classList.add('opacity-0', 'scale-95', 'pointer-events-none', 'z-0');
          if (dot) { dot.classList.remove('w-5', 'bg-brand-400'); dot.classList.add('w-1.5', 'bg-white/40'); }
        }
      });
    }

    function nextSlide() {
      const count = document.querySelectorAll('.carousel-slide').length;
      if (count <= 1) return;
      currentSlideIndex = (currentSlideIndex + 1) % count;
      updateSlideDisplay();
    }

    function prevSlide() {
      const count = document.querySelectorAll('.carousel-slide').length;
      if (count <= 1) return;
      currentSlideIndex = (currentSlideIndex - 1 + count) % count;
      updateSlideDisplay();
    }

    function goToSlide(idx) {
      currentSlideIndex = idx;
      updateSlideDisplay();
    }

    function toggleFilterPanel() {
      const panel = document.getElementById('filterPanel');
      if (panel) panel.classList.toggle('hidden');
    }

    function renderFilterTagsGrid() {
      const container = document.getElementById('filterTagsGrid');
      if (!container) return;
      container.innerHTML = '';

      ALL_TAGS.forEach(tag => {
        const isSelected = selectedFilterTags.includes(tag);
        const btn = document.createElement('button');
        btn.type = "button";
        btn.className = `px-2 py-1 rounded-lg text-[11px] font-bold transition-all cursor-pointer ${
          isSelected ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'
        }`;
        btn.textContent = tag;
        btn.onclick = () => {
          if (selectedFilterTags.includes(tag)) selectedFilterTags = selectedFilterTags.filter(t => t !== tag);
          else selectedFilterTags.push(tag);
          renderFilterTagsGrid();
          renderProductGrid();
        };
        container.appendChild(btn);
      });
    }

    function renderProductGrid() {
      const grid = document.getElementById('productGrid');
      const emptyNotice = document.getElementById('noResultsNotice');
      const counterBadge = document.getElementById('productCounterBadge');
      if (!grid) return;

      let filtered = products.filter(prod => {
        const prodTags = getProductTags(prod);
        let matchesTags = selectedFilterTags.length === 0 || selectedFilterTags.some(t => prodTags.includes(t));
        const q = activeSearchQuery.toLowerCase().trim();
        let matchesQuery = !q || (prod.title && prod.title.toLowerCase().includes(q)) || prodTags.some(t => t.toLowerCase().includes(q));

        const effectivePrice = getProductStartingPrice(prod);
        let matchesMin = activeMinPrice === null || isNaN(activeMinPrice) || effectivePrice >= activeMinPrice;
        let matchesMax = activeMaxPrice === null || isNaN(activeMaxPrice) || effectivePrice <= activeMaxPrice;

        return matchesTags && matchesQuery && matchesMin && matchesMax;
      });

      filtered.sort((a, b) => {
        const canBuyA = isAvailableForDirectPurchase(a);
        const canBuyB = isAvailableForDirectPurchase(b);
        if (canBuyA && !canBuyB) return -1;
        if (!canBuyA && canBuyB) return 1;

        if (activePriceOrder === 'low-to-high') return getProductStartingPrice(a) - getProductStartingPrice(b);
        if (activePriceOrder === 'high-to-low') return getProductStartingPrice(b) - getProductStartingPrice(a);
        return (b.id || 0) - (a.id || 0);
      });

      if (counterBadge) counterBadge.textContent = filtered.length;
      grid.innerHTML = '';

      if (filtered.length === 0) {
        if (emptyNotice) emptyNotice.classList.remove('hidden');
        return;
      }
      if (emptyNotice) emptyNotice.classList.add('hidden');

      filtered.forEach(prod => {
        const card = document.createElement('article');
        card.className = "group bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-xs flex flex-col cursor-pointer";
        card.onclick = () => openDetailModalById(prod.id);

        const photo = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://placehold.co/400x400?text=3D';
        const canBuy = isAvailableForDirectPurchase(prod);
        const hasVariants = Array.isArray(prod.variants) && prod.variants.length > 0;

        let priceHtml = '';
        if (!canBuy) {
          priceHtml = '<span class="text-xs font-bold text-slate-400">A pedido</span>';
        } else if (hasVariants) {
          priceHtml = `
            <div>
              <span class="text-[9px] uppercase font-bold text-slate-400 block leading-tight">Desde</span>
              <span class="text-sm font-black font-mono text-slate-900">$${getProductStartingPrice(prod)}</span>
            </div>
          `;
        } else {
          priceHtml = `<span class="text-sm font-black font-mono text-slate-900">${prod.price}</span>`;
        }

        card.innerHTML = `
          <div class="relative w-full aspect-square bg-slate-100 overflow-hidden">
            <img src="${photo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
            <div class="absolute top-2 left-2 flex flex-col gap-1">
              <span class="px-1.5 py-0.5 rounded text-[9px] font-black uppercase ${canBuy ? 'bg-brand-500 text-white' : 'bg-slate-700 text-white'}">
                ${prod.material || 'PLA'}
              </span>
            </div>
            ${hasVariants ? '<div class="absolute bottom-2 left-2 px-2 py-0.5 rounded-full bg-slate-900/80 backdrop-blur-xs text-[9px] text-white font-bold flex items-center gap-1"><i class="ph-bold ph-stack"></i> Varios tamaños</div>' : ''}
          </div>

          <div class="p-2.5 sm:p-3 flex flex-col flex-grow justify-between">
            <div>
              <span class="text-[9px] font-mono text-slate-400 block">${prod.sku || '3D'}</span>
              <h3 class="font-bold text-slate-900 text-xs sm:text-sm line-clamp-1 mt-0.5 group-hover:text-brand-600 transition-colors">${prod.title}</h3>
            </div>

            <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between">
              <div>${priceHtml}</div>
              <div class="w-6 h-6 rounded-lg bg-slate-100 text-slate-700 flex items-center justify-center group-hover:bg-slate-900 group-hover:text-white transition-colors">
                <i class="ph-bold ph-arrow-right text-xs"></i>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleSearch(val) {
      activeSearchQuery = val;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) clearBtn.classList.toggle('hidden', val.trim().length === 0);
      renderProductGrid();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) { input.value = ''; handleSearch(''); }
    }

    function handlePriceOrderChange(val) {
      activePriceOrder = val;
      renderProductGrid();
    }

    function handleCustomPriceRange() {
      const minVal = document.getElementById('minPriceInput').value.trim();
      const maxVal = document.getElementById('maxPriceInput').value.trim();
      activeMinPrice = minVal !== "" ? parseFloat(minVal) : null;
      activeMaxPrice = maxVal !== "" ? parseFloat(maxVal) : null;
      renderProductGrid();
    }

    function resetFilters() {
      selectedFilterTags = [];
      activePriceOrder = "all";
      activeMinPrice = null;
      activeMaxPrice = null;
      const orderSelect = document.getElementById('priceOrderSelect');
      if (orderSelect) orderSelect.value = "all";
      document.getElementById('minPriceInput').value = '';
      document.getElementById('maxPriceInput').value = '';
      clearSearch();
      renderFilterTagsGrid();
      renderProductGrid();
    }

    function openDetailModalById(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      activeProductInModal = product;
      activeModalImageIndex = 0;
      currentSelectedVariant = null;

      const hasVariants = Array.isArray(product.variants) && product.variants.length > 0;
      const canBuy = isAvailableForDirectPurchase(product);

      document.getElementById('modalSku').textContent = product.sku || '3D';
      document.getElementById('modalTitle').textContent = product.title;
      document.getElementById('modalDescription').textContent = product.description || 'Sin descripción adicional.';
      document.getElementById('modalMaterialBadge').textContent = product.material || 'PLA';

      const priceDisplay = document.getElementById('modalPrice');
      const variantLabel = document.getElementById('modalSelectedVariantLabel');
      const variantsWrapper = document.getElementById('modalVariantsWrapper');
      const variantsList = document.getElementById('modalVariantsList');

      if (hasVariants) {
        variantsWrapper.classList.remove('hidden');
        variantLabel.classList.remove('hidden');
        variantsList.innerHTML = '';

        currentSelectedVariant = product.variants[0];
        priceDisplay.textContent = currentSelectedVariant.price;
        variantLabel.textContent = `(${currentSelectedVariant.name})`;

        product.variants.forEach((v, idx) => {
          const btn = document.createElement('button');
          btn.type = "button";
          btn.className = `w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between border transition-all cursor-pointer ${
            idx === 0 ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
          }`;
          btn.innerHTML = `
            <span>${v.name}</span>
            <span class="font-mono text-xs ${idx === 0 ? 'text-brand-400' : 'text-slate-900'}">${v.price}</span>
          `;
          btn.onclick = () => {
            currentSelectedVariant = v;
            priceDisplay.textContent = v.price;
            variantLabel.textContent = `(${v.name})`;
            Array.from(variantsList.children).forEach(c => {
              c.className = "w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between border transition-all bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100 cursor-pointer";
              c.querySelector('span:last-child').className = "font-mono text-xs text-slate-900";
            });
            btn.className = "w-full px-3 py-2 rounded-xl text-xs font-bold flex items-center justify-between border transition-all bg-slate-900 text-white border-slate-900 cursor-pointer";
            btn.querySelector('span:last-child').className = "font-mono text-xs text-brand-400";
          };
          variantsList.appendChild(btn);
        });
      } else {
        variantsWrapper.classList.add('hidden');
        variantLabel.classList.add('hidden');
        priceDisplay.textContent = canBuy ? product.price : 'Consultar';
      }

      const tagsContainer = document.getElementById('modalTagsContainer');
      tagsContainer.innerHTML = '';
      getProductTags(product).forEach(t => {
        const badge = document.createElement('span');
        badge.className = "px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-bold";
        badge.textContent = t;
        tagsContainer.appendChild(badge);
      });

      updateModalGallery();
      document.getElementById('detailModal').classList.remove('opacity-0', 'pointer-events-none');
    }

    function updateModalGallery() {
      if (!activeProductInModal) return;
      const images = (activeProductInModal.images && activeProductInModal.images.length > 0)
        ? activeProductInModal.images
        : ['https://placehold.co/400x400?text=3D'];

      document.getElementById('modalMainImage').src = images[activeModalImageIndex] || images[0];
      const thumbsContainer = document.getElementById('modalThumbnails');
      thumbsContainer.innerHTML = '';

      images.forEach((imgUrl, index) => {
        const btn = document.createElement('button');
        btn.className = `aspect-square rounded-lg overflow-hidden border cursor-pointer ${index === activeModalImageIndex ? 'border-slate-900' : 'border-transparent opacity-60'}`;
        btn.onclick = () => { activeModalImageIndex = index; updateModalGallery(); };
        btn.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover">`;
        thumbsContainer.appendChild(btn);
      });
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.add('opacity-0', 'pointer-events-none');
      activeProductInModal = null;
      currentSelectedVariant = null;
    }

    function refreshAllViews() {
      initCarousel();
      renderFilterTagsGrid();
      renderProductGrid();
    }

    function handleInquireAction() {
      if (!activeProductInModal) return;
      let text = '';
      if (currentSelectedVariant) {
        text = `Hola! Quiero pedir la pieza "${activeProductInModal.title}" en la opción: ${currentSelectedVariant.name} (${currentSelectedVariant.price}).`;
      } else {
        text = `Hola! Quiero consultar por: "${activeProductInModal.title}" (${activeProductInModal.price || 'A pedido'}).`;
      }
      window.open(`https://wa.me/5491123539321?text=${encodeURIComponent(text)}`, '_blank');
    }

    function copyProductLink() {
      if (!activeProductInModal) return;
      const dummy = document.createElement('input');
      document.body.appendChild(dummy);
      dummy.value = `${window.location.origin}${window.location.pathname}#product-${activeProductInModal.id}`;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      const toast = document.getElementById('toast');
      toast.classList.remove('translate-y-16', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-16', 'opacity-0'), 2500);
    }

    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;
    window.toggleFilterPanel = toggleFilterPanel;
    window.handleSearch = handleSearch;
    window.clearSearch = clearSearch;
    window.handlePriceOrderChange = handlePriceOrderChange;
    window.handleCustomPriceRange = handleCustomPriceRange;
    window.resetFilters = resetFilters;
    window.openDetailModalById = openDetailModalById;
    window.closeDetailModal = closeDetailModal;
    window.handleInquireAction = handleInquireAction;
    window.copyProductLink = copyProductLink;

    initRealtimeListener();
  </script>
</body>
</html>
